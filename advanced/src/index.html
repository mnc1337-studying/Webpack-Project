<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Список справ</title>
</head>

<body class="page">
    <header class="header">
        <h1 class="header__title">Список справ</h1>
    </header>
    <main class="container">
        <section class="todo">
            <form class="todo__form" id="todo-form">
                <input class="todo__input" id="todo-input" type="text" placeholder="Що потрібно зробити?"
                    autocomplete="off">
                <button class="button" type="submit">Додати</button>
            </form>
            <p class="todo__counter" id="todo-counter"></p>
            <ul class="todo__list" id="todo-list"></ul>
        </section>
    </main>
</body>

</html>
